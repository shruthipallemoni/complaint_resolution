[project]
name = "complaint_resolution"
version = "0.1.0"
description = "complaint_resolution using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]>=1.15.12,<2.0.0",
    "pytest>=9.1.1",
]

[project.scripts]
complaint_resolution = "complaint_resolution.main:run"
run_crew = "complaint_resolution.main:run"
train = "complaint_resolution.main:train"
replay = "complaint_resolution.main:replay"
test = "complaint_resolution.main:test"
run_with_trigger = "complaint_resolution.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "e86d3ed9-cf99-45cc-9a0c-357a0400bcd6"
