classification_task:
  description: >
    Analyze the following customer complaint and extract structured
    information from it.

    Complaint: {complaint_text}

    Extract:
    - The complaint category (e.g. shipping, billing, product_defect)
    - Any specific dollar amount the customer mentions (null if none stated —
      do not guess or estimate an amount that wasn't explicitly given)
    - The emotional tone: neutral, frustrated, angry, or threatening_to_leave
    - A one-sentence summary of the actual issue
  expected_output: >
    A structured classification with category, financial_impact, emotional_signal,
    and summary. No preamble, no commentary.
  agent: classifier_agent

auto_resolution_task:
  description: >
    This complaint has been assessed as LOW RISK and is eligible for
    auto-resolution.

    Complaint: {complaint_text}
    Classification: {classification}

    Using the company policy document provided as knowledge, determine the
    specific action authorized for this situation, and draft a warm,
    professional customer-facing reply. You must cite which policy rule
    justifies the action. Do not propose or promise anything not explicitly
    authorized by policy for this category and amount {previous_attempt_feedback}.
  expected_output: >
    A proposed_action, a draft_reply (the actual customer-facing text), and
    a policy_reference citing the specific rule used. No preamble.
  agent: auto_resolver_agent

escalation_task:
  description: >
    This complaint has been assessed as HIGH RISK and requires human review
    before any reply is sent.

    Complaint: {complaint_text}
    Classification: {classification}
    Risk Assessment: {risk_assessment}

    Using the company policy document as knowledge, draft a proposed reply
    and action as if it could be sent — a human will review it before it
    actually goes out. Also state plainly, in the policy_reference field,
    why this case could not be auto-resolved (cite the specific risk factor:
    amount over limit, repeat issue, or emotional escalation){previous_attempt_feedback}.
  expected_output: >
    A proposed_action, a draft_reply, and a policy_reference explaining both
    the proposed resolution and why human review is required. No preamble.
  agent: escalation_drafter_agent

guardrail_task:
  description: >
    Validate the following drafted reply against the original complaint and
    company policy.

    Original complaint: {complaint_text}
    Drafted reply: {draft_reply}
    Proposed action: {proposed_action}

    Check three things:
    1. issue_acknowledged — does the reply clearly address what the customer
       actually complained about?
    2. within_authorization — does the proposed action match what company
       policy actually authorizes for this category and amount, per the
       knowledge source?
    3. no_invented_facts — does the reply avoid inventing any refund amount,
       date, replacement detail, or policy that wasn't actually approved?

    If any check fails, set passed to false and explain exactly what failed
    in failure_reason, specific enough that a redraft could fix it.
  expected_output: >
    issue_acknowledged, within_authorization, no_invented_facts (each true/false),
    an overall passed boolean, and failure_reason if passed is false. No preamble.
  agent: guardrail_agent